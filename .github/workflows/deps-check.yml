name: Dependency Health Check

on:
  schedule:
    - cron: '23 2 * * 1'  # Senin 10:23 WITA
    - cron: '23 2 * * 4'  # Kamis 10:23 WITA
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-audit:
    name: Scheduled audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deprecation audit
        id: audit
        run: |
          npx npm-deprecation-checker --json --no-color > ndc-report.json || true

      - name: Add audit summary
        run: |
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('ndc-report.json', 'utf8'));
          const lines = [
            '## Dependency audit',
            '',
            `- Scanned at: ${report.scannedAt}`,
            `- Package file: ${report.packageJsonPath}`,
            `- Total scanned: ${report.totalScanned}`,
            `- Deprecated: ${report.deprecatedCount}`,
            `- Major outdated: ${report.majorOutdatedCount}`,
            `- Pre-release: ${report.preReleaseCount}`,
            `- Errors: ${report.errorCount}`,
            '',
            '> Scheduled audit is informational only and does not fail the workflow.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndc-report-scheduled
          path: ndc-report.json

  pr-validation:
    name: PR validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run strict dependency check
        run: npx npm-deprecation-checker --strict --no-color

      - name: Add PR summary
        if: always()
        run: |
          {
            echo '## PR dependency validation'
            echo ''
            echo '- Mode: strict'
            echo '- Trigger: pull_request'
            echo '- Result: see logs above for deprecated or major outdated packages'
          } >> "$GITHUB_STEP_SUMMARY"
